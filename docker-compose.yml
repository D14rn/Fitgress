services:
  postgres:
    image: postgres:18.6-alpine
    container_name: fitgress-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}

      FITGRESS_DB_NAME: ${FITGRESS_DB_NAME:-fitgress}
      FITGRESS_DB_USER: ${FITGRESS_DB_USER:-fitgress}
      FITGRESS_DB_PASSWORD: ${FITGRESS_DB_PASSWORD:-fitgress}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
